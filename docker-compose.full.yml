services:
  asr:
    build: .
    ports:
      - "18001:18001"
    command: ["uvicorn", "asr_service.main:app", "--host", "0.0.0.0", "--port", "18001"]
    environment:
      - ASR_MODEL_ID=Qwen/Qwen3-ASR-1.7B-hf
      - ASR_DEVICE=cuda:0
      - ASR_DTYPE=bfloat16
      - ASR_CHUNK_MS=500
      - HF_HOME=/models
    volumes:
      - hf_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  vllm:
    build: ./vllm_service
    ports:
      - "18002:18002"
    environment:
      - HF_HOME=/models
    volumes:
      - hf_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tts:
    build: ./tts_service
    ports:
      - "18003:18003"
    environment:
      - HF_HOME=/models
    volumes:
      - hf_cache:/models
      - ./tts_service/ref_audio:/app/ref_audio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --node-id gx10-node
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-60000:50000-60000/udp"
    volumes:
      - ./livekit_server/livekit.yaml:/etc/livekit.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent:
    build: ./livekit_agent
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: LIVEKIT_API_KEY
      LIVEKIT_API_SECRET: LIVEKIT_API_SECRET
      ASR_ENDPOINT: http://asr:18001
      VLLM_ENDPOINT: http://vllm:18002/v1
      TTS_ENDPOINT: http://tts:18003
    depends_on:
      asr:
        condition: service_started
      vllm:
        condition: service_started
      tts:
        condition: service_started
      livekit:
        condition: service_started

volumes:
  hf_cache:

networks:
  default:
    name: livekit-poc-network
