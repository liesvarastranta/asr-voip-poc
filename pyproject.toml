[project]
name = "asr-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
]

[project.optional-dependencies]
gpu = [
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
