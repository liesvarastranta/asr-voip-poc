services:
  asr:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ASR_MODEL_ID=Qwen/Qwen3-ASR-1.7B-hf
      - ASR_DEVICE=cuda:0
      - ASR_DTYPE=bfloat16
      - ASR_CHUNK_MS=500
      - HF_HOME=/models
    volumes:
      - hf_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hf_cache:
